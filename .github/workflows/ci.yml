name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # Version comes from global.json (pinned to 10.0.110).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        # Emits the React bundle into src/Rod.TeamServer/wwwroot so the .NET
        # build packages it. The output is gitignored.
        working-directory: src/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: src/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        working-directory: src/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Rod.slnx --configuration Release --no-build

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Verify formatting
        run: dotnet format Rod.slnx --verify-no-changes

  go:
    name: Go implant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        # The implant module declares go 1.26; stable satisfies it.
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: implant/go.sum
      - name: Build implant
        working-directory: implant
        # -mod=readonly keeps the build hermetic; the module graph is pinned in
        # go.sum and committed, so CI does not mutate it.
        run: go build -mod=readonly ./...
      - name: Vet implant
        working-directory: implant
        run: go vet -mod=readonly ./...
      - name: Test implant
        working-directory: implant
        run: go test -mod=readonly ./...
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore
      - name: Go implant end-to-end (roadmap M3.2)
        # GoImplantTests shells out to go to build and run the reference implant
        # against a real teamserver; it is otherwise skipped (no go on PATH), so
        # this is the job that proves the implant checks in and tasks end-to-end.
        run: dotnet test Rod.slnx --configuration Release --no-build --filter "FullyQualifiedName~GoImplantTests"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        # Run the MIT-licensed gitleaks CLI directly rather than the
        # gitleaks-action wrapper, which requires a paid license key since v2.
        # Same scan the action ran: every commit in history, fail on any finding.
        # Pin the version explicitly so a upstream release cannot silently change
        # results.
        env:
          GITLEAKS_VERSION: "8.27.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose
