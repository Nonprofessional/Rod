name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly full-lane pass: every lane runs, extended included, so the
    # non-blocking lane still gets a scheduled verdict.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    # Pinned: the ubuntu-latest label migrates to Ubuntu 26 in October 2026,
    # and an unpinned label lets a runner image change the toolchain under us.
    runs-on: ubuntu-24.04
    env:
      # The blocking lane: every suite that stays inside .NET -- no cargo, no
      # real implant processes. The classes excluded here are the ones that
      # shell out to cargo (the pipeline-build acceptance and the Rust
      # end-to-end family) plus the conformance harness; they are the
      # implant-toolchain lane below, non-blocking by design.
      CORE_FILTER: >-
        FullyQualifiedName!~Rod.Conformance.Tests
        &FullyQualifiedName!~RustImplantEndToEndTests
        &FullyQualifiedName!~PayloadBuildTests
        &FullyQualifiedName!~PayloadJobTests
        &FullyQualifiedName!~PayloadTransformChainTests
      # The implant-toolchain lane: the complement of the core lane. It
      # compiles the real Rust implant via cargo and proves it against a live
      # teamserver, which needs the toolchain warm and the runner to itself --
      # under cargo's target-dir lock those tests time out when run beside a
      # full parallel suite, so they get their own lane, serialized.
      EXTENDED_FILTER: >-
        FullyQualifiedName~Rod.Conformance.Tests
        |FullyQualifiedName~RustImplantEndToEndTests
        |FullyQualifiedName~PayloadBuildTests
        |FullyQualifiedName~PayloadJobTests
        |FullyQualifiedName~PayloadTransformChainTests
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        # Version comes from global.json (pinned to 10.0.110).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Pinned like global.json pins the SDK: Vite 8 needs >=20.19 or
          # >=22.12, and an unpinned lts/* lets a runner image change the
          # toolchain under us.
          node-version: 24
          cache: npm
          cache-dependency-path: src/teamserver/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        # Emits the React bundle into src/teamserver/Rod.TeamServer/wwwroot so
        # the .NET build packages it. The output is gitignored.
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore
      - name: Test (core lane)
        id: test_core
        # Blame-hang turns a silent hang into a five-minute failure that dumps
        # the stuck test host and names the test it was running. The suite has
        # hung without progress three times before (Aug 18, 19, and Sep 1,
        # cancelled at the six-hour budget) -- without this, a hung host just
        # burns the runner until someone cancels by hand.
        # ci.runsettings caps assembly parallelism (see the file for why).
        # Full dumps (not mini) so `dotnet-dump analyze -c dumpasync` can name
        # the suspended state machine on the CI side the way the local repro
        # did: a hung beacon read is invisible to thread stacks.
        # The trx log is what the targeted retry below reads: the first
        # attempt's failures decide what the retry runs.
        continue-on-error: true
        run: >-
          dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings
          --filter "$CORE_FILTER"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          --logger trx
      - name: Collect the core lane's failures
        # The targeted retry's input: the failed tests' names out of the first
        # attempt's trx logs, as a dotnet-test filter.
        if: steps.test_core.outcome == 'failure'
        run: python3 scripts/ci/collect-trx-failures.py CORE_RETRY_FILTER
      - name: Test (core lane, retry the failures)
        # The retry is targeted, not whole-suite: one-off flakes under a
        # constrained runner are absorbed, and the job stays red only when the
        # SAME test fails twice in a row -- a real regression. The sentinel
        # keeps the whole-suite fallback for the hang class with no parseable
        # results.
        if: steps.test_core.outcome == 'failure'
        run: |
          if [ "$CORE_RETRY_FILTER" = "__all__" ]; then
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$CORE_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          else
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$CORE_RETRY_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          fi
      - name: Test (implant-toolchain lane)
        # Non-blocking by design: this lane carries the environment-sensitive
        # family -- cargo compiles, real implant processes, and the conformance
        # harness against a live teamserver -- whose failures are worth triage
        # without being worth a red run on every push. The nightly schedule
        # gives it a standing verdict.
        id: test_extended
        continue-on-error: true
        run: >-
          dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings
          --filter "$EXTENDED_FILTER"
          --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          --logger trx
      - name: Collect the implant-toolchain lane's failures
        # A GITHUB_ENV write only reaches later steps, so collecting inside the
        # retry step would leave the filter empty and run the whole lane.
        if: steps.test_extended.outcome == 'failure'
        run: python3 scripts/ci/collect-trx-failures.py EXTENDED_RETRY_FILTER
      - name: Test (implant-toolchain lane, retry the failures)
        # The same targeted retry the core lane uses, kept non-blocking.
        if: steps.test_extended.outcome == 'failure'
        continue-on-error: true
        run: |
          if [ "$EXTENDED_RETRY_FILTER" = "__all__" ]; then
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$EXTENDED_FILTER" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          else
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$EXTENDED_RETRY_FILTER" --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type full
          fi
      - name: Upload test diagnostics
        # The blame collector writes the hang dump and the test sequence (its
        # last entry names the hung test) under TestResults; they only survive
        # the runner if they are uploaded before the job tears down.
        if: steps.test_core.outcome == 'failure' || steps.test_extended.outcome == 'failure'
        uses: actions/upload-artifact@v5
        with:
          name: test-diagnostics
          path: '**/TestResults/**'
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
      - name: Verify formatting
        run: dotnet format Rod.slnx --verify-no-changes

  rust-implant:
    name: Rust implant
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install protoc and the cross linkers
        # prost-build compiles rod.proto through a system protoc (the .NET
        # side rides Grpc.Tools' bundled one, so this is the tree's first
        # protoc need); musl-tools and mingw-w64 link the two reference
        # crosses the implant ships as.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools mingw-w64
      - name: Add the cross targets
        # The runner image ships a stable rustup; the targets and components
        # join it rather than pinning a second toolchain manager.
        run: |
          rustup component add clippy rustfmt
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu
      - name: Format check
        run: cargo fmt --manifest-path src/implant/rust/Cargo.toml -- --check
      - name: Lint
        run: cargo clippy --manifest-path src/implant/rust/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        # The crate's #[cfg(test)] suites: the seal, wire codec, profile
        # bake, tasking verifier, outbox, session, and handler surfaces.
        # The live-behavior half -- enrolls, contacts, and tasking against
        # a real teamserver -- is the implant-toolchain lane above.
        run: cargo test --manifest-path src/implant/rust/Cargo.toml
      - name: Build the reference crosses
        # The implant of record's shipped shapes (architecture.md Sec 12.2):
        # static musl on Linux, mingw on Windows. Building both on every
        # push keeps the crosses from rotting behind host-only builds.
        run: |
          cargo build --release --target x86_64-unknown-linux-musl --manifest-path src/implant/rust/Cargo.toml
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path src/implant/rust/Cargo.toml
      - name: Verify the static binary
        # The unbaked binary's documented refusal -- no profile, no run,
        # exit 2 -- proves the static artifact actually executes on the
        # runner.
        run: |
          set -e
          bin=src/implant/rust/target/x86_64-unknown-linux-musl/release/rod-implant
          test -x "$bin"
          ls -lh "$bin"
          set +e
          "$bin"
          code=$?
          set -e
          test "$code" -eq 2

  dotnet-redirector:
    name: .NET redirector (Native AOT)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        # Native AOT publish uses the SDK pinned by global.json and the platform
        # link-time toolchain the ubuntu-24.04 runner provides.
        uses: actions/setup-dotnet@v5
      - name: Install Native AOT link prerequisites
        # .NET Native AOT link-time analysis needs zlib on the build host; the
        # runner carries clang already. zlib1g-dev is a documented Native AOT
        # dependency on Debian/Ubuntu.
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Publish Native AOT forwarder
        # The redirector is a .NET Native AOT forwarder (ADR 0009/0011): a single
        # static binary with no runtime install. PublishAot is set in the csproj,
        # so this produces a native rod-redirector binary on the runner -- the
        # real proof the AOT property holds end to end. Normal build, test, and
        # format of the project are already covered by the build-and-test and
        # format jobs above (it ships in Rod.slnx).
        run: dotnet publish src/redirector/dotnet/Rod.Redirector.csproj -r linux-x64 -c Release
      - name: Verify single binary
        run: |
          set -e
          bin="$(find src/redirector/dotnet/bin/Release/net10.0/linux-x64/publish -maxdepth 1 -name rod-redirector -type f)"
          test -n "$bin"
          test -x "$bin"
          ls -lh "$bin"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        # Run the MIT-licensed gitleaks CLI directly rather than the
        # gitleaks-action wrapper, which requires a paid license key since v2.
        # Same scan the action ran: every commit in history, fail on any finding.
        # Pin the version explicitly so an upstream release cannot silently
        # change results.
        env:
          GITLEAKS_VERSION: "8.27.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose
