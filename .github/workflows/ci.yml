name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly full-lane pass: every job runs, extended included, so the
    # non-blocking lane still gets a scheduled verdict.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        # Version comes from global.json (pinned to 10.0.110).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Pinned like global.json pins the SDK: Vite 8 needs >=20.19 or
          # >=22.12, and an unpinned lts/* lets a runner image change the
          # toolchain under us.
          node-version: 24
          cache: npm
          cache-dependency-path: src/teamserver/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        # Emits the React bundle into src/teamserver/Rod.TeamServer/wwwroot so the .NET
        # build packages it. The output is gitignored.
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Lint operator UI
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: npm run lint
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    env:
      # The core lane: everything except the subprocess-behavior tests -- the
      # real-implant classes and the conformance harness run in the
      # non-blocking extended job (they are the slowest and the flakiest
      # family, and their failures read best on their own lane, not as a red
      # run on every push). The retry steps below inherit this scope.
      # The QUIC acceptance sits in the extended lane too, temporarily:
      # the runner's libmsquic 2.6.1 (apt's current) regressed the TLS
      # handshake System.Net.Quic rides -- local runs against 2.4.16 stay
      # green -- so the lane keeps its coverage without external breakage
      # reddening every push. Move it back (and drop the note) once a good
      # libmsquic ships.
      CORE_FILTER: "FullyQualifiedName!~DotNetImplantTests&FullyQualifiedName!~ExtensionKitEndToEndTests&FullyQualifiedName!~StagerEndToEndTests&FullyQualifiedName!~QuicBeaconRoundTripTests&FullyQualifiedName!~Rod.Conformance.Tests"
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/teamserver/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore
      - name: Test
        id: test_first
        # Blame-hang turns a silent hang into a five-minute failure that dumps
        # the stuck test host and names the test it was running. The suite has
        # hung without progress twice before (Aug 18 and 19, cancelled at the
        # six-hour budget) and did it again on Sep 1 -- without this, a hung
        # host just burns the runner until someone cancels by hand.
        # ci.runsettings caps assembly parallelism (see the file for why).
        # Full dumps (not mini) so `dotnet-dump analyze -c dumpasync` can name
        # the suspended state machine on the CI side the way the local repro
        # did: a hung beacon read is invisible to thread stacks.
        # The trx log is what the targeted retry below reads: the first
        # attempt's failures decide what the retry runs.
        continue-on-error: true
        run: >-
          dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings
          --filter "$CORE_FILTER"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          --logger trx
      - name: Upload test diagnostics
        # The blame collector writes the hang dump and the test sequence (its
        # last entry names the hung test) under TestResults; they only survive
        # the runner if they are uploaded before the job tears down.
        if: steps.test_first.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-first-attempt
          path: '**/TestResults/**'
          if-no-files-found: ignore
      - name: Collect the first attempt's failures
        # The targeted retry's input: the failed tests' names out of the first
        # attempt's trx logs, as a dotnet-test filter. Nothing parseable (a
        # runner-level hang with no results) leaves the sentinel, and the
        # retry below falls back to the whole suite -- the old shape, kept for
        # the hang class it absorbed.
        if: steps.test_first.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          names = set()
          for trx in glob.glob('**/TestResults/*.trx', recursive=True):
              root = ET.parse(trx).getroot()
              # The trx schema carries an XML namespace; matching on the
              # namespace-stripped local name keeps the lookup immune to its
              # version suffix (ElementTree's iter has no wildcard form).
              id_to_name = {}
              results = []
              for element in root.iter():
                  local = element.tag.rsplit('}', 1)[-1]
                  if local == 'UnitTest':
                      id_to_name[element.get('id')] = element.get('name')
                  elif local == 'UnitTestResult':
                      results.append(element)
              for result in results:
                  if result.get('outcome') in ('Failed', 'Error', 'Timeout', 'Aborted'):
                      name = result.get('testName') or id_to_name.get(result.get('testId')) or ''
                      # Theory cases carry their arguments in the display name;
                      # the bare method name still selects every case.
                      names.add(name.split('(')[0])

          retry = '|'.join(f'FullyQualifiedName~{n}' for n in sorted(names) if n)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RETRY_FILTER={retry or "__all__"}\n')
          print('retry filter:', retry or '__all__ (whole suite)')
          PY
      - name: Test (retry the failures)
        # The retry is targeted, not whole-suite: the suite's real-network
        # end-to-end tests carry timing races that fail independently under a
        # constrained runner -- a whole-suite retry let flake A fail the first
        # attempt and flake B fail the second and the job went red on neither
        # twice. Rerunning only the first attempt's failures means the job
        # stays red only when the SAME test fails twice in a row -- a real
        # regression -- while an independent one-off flake is absorbed. The
        # sentinel keeps the whole-suite fallback for the hang class with no
        # parseable results.
        if: steps.test_first.outcome == 'failure'
        run: |
          if [ "$RETRY_FILTER" = "__all__" ]; then
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$CORE_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          else
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$RETRY_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          fi
      - name: Upload test diagnostics (retry)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-retry
          path: '**/TestResults/**'
          if-no-files-found: ignore

  test-extended:
    name: Test (extended)
    runs-on: ubuntu-latest
    needs: build
    # Non-blocking by design: this lane carries the slowest, most
    # environment-sensitive family -- the real-implant subprocess classes and
    # the conformance harness -- whose failures are worth triage without
    # being worth a red run on every push. The nightly schedule gives it a
    # standing verdict; a failure here shows on the job, not on the run.
    continue-on-error: true
    env:
      EXTENDED_FILTER: "FullyQualifiedName~DotNetImplantTests|FullyQualifiedName~ExtensionKitEndToEndTests|FullyQualifiedName~StagerEndToEndTests|FullyQualifiedName~QuicBeaconRoundTripTests|FullyQualifiedName~Rod.Conformance.Tests"
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/teamserver/Rod.TeamServer/Client/package-lock.json
      - name: Build operator UI
        working-directory: src/teamserver/Rod.TeamServer/Client
        run: |
          npm ci
          npm run build
      - name: Restore
        run: dotnet restore Rod.slnx
      - name: Build
        run: dotnet build Rod.slnx --configuration Release --no-restore
      - name: Install libmsquic
        # System.Net.Quic needs libmsquic on Linux, and the QUIC transport
        # acceptance (QuicBeaconRoundTripTests -- this lane's, see the core
        # filter's note) dials a real listener. Ubuntu carries it only in
        # Microsoft's prod repo; the runner image ships none.
        #
        # The 24.04 repo floats a single release (2.6.1 as of 2026-09) whose
        # TLS handshake System.Net.Quic cannot complete, and it carries
        # nothing older to pin -- but the 22.04 pool keeps every release, so
        # the known-good 2.4.16 (the version local runs verify) installs
        # straight from there. If that URL ever goes away, the fallback is
        # the repo's latest and QuicFactAttribute stands the tests down on
        # the broken releases rather than reddening the lane.
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/keyrings/microsoft.asc >/dev/null
          curl -sSL "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/prod.list" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list >/dev/null
          sudo apt-get update
          if curl -fsSL -o libmsquic_2.4.16_amd64.deb \
              "https://packages.microsoft.com/ubuntu/22.04/prod/pool/main/libm/libmsquic/libmsquic_2.4.16_amd64.deb" \
              && sudo apt-get install -y ./libmsquic_2.4.16_amd64.deb; then
            echo "installed the pinned libmsquic 2.4.16 (22.04 pool)"
          else
            echo "the 22.04-pool pin failed; falling back to the repo's latest"
            sudo apt-get install -y libmsquic
          fi
      - name: Test (extended lane)
        id: test_extended_first
        # The same blame-hang posture the core lane runs with: a hang names
        # its test and dumps the host instead of burning the runner.
        continue-on-error: true
        run: >-
          dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings
          --filter "$EXTENDED_FILTER"
          --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          --logger trx
      - name: Collect the extended lane's failures
        # The targeted retry's input, as its own step: a GITHUB_ENV write
        # only reaches later steps, so collecting inside the retry step
        # left the filter empty and the retry ran the whole suite.
        if: steps.test_extended_first.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          names = set()
          for trx in glob.glob('**/TestResults/*.trx', recursive=True):
              root = ET.parse(trx).getroot()
              id_to_name = {}
              results = []
              for element in root.iter():
                  local = element.tag.rsplit('}', 1)[-1]
                  if local == 'UnitTest':
                      id_to_name[element.get('id')] = element.get('name')
                  elif local == 'UnitTestResult':
                      results.append(element)
              for result in results:
                  if result.get('outcome') in ('Failed', 'Error', 'Timeout', 'Aborted'):
                      name = result.get('testName') or id_to_name.get(result.get('testId')) or ''
                      names.add(name.split('(')[0])

          retry = '|'.join(f'FullyQualifiedName~{n}' for n in sorted(names) if n)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'EXTENDED_RETRY_FILTER={retry or "__all__"}\n')
          print('retry filter:', retry or '__all__ (whole lane)')
          PY
      - name: Test (extended lane, retry the failures)
        # The targeted retry the core lane uses: only the failed tests
        # rerun, so a one-off environment flake is absorbed and only a
        # repeated failure stays. The sentinel keeps the whole-lane
        # fallback.
        if: steps.test_extended_first.outcome == 'failure'
        run: |
          if [ "$EXTENDED_RETRY_FILTER" = "__all__" ]; then
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$EXTENDED_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          else
            dotnet test Rod.slnx --configuration Release --no-build --settings ci.runsettings --filter "$EXTENDED_RETRY_FILTER" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type full
          fi
      - name: Upload test diagnostics (extended)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-extended
          path: '**/TestResults/**'
          if-no-files-found: ignore

  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: Verify formatting
        run: dotnet format Rod.slnx --verify-no-changes

  dotnet-implant:
    name: .NET implant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        # The reference .NET implant targets net10.0; the latest SDK satisfies it.
        uses: actions/setup-dotnet@v4
      - name: .NET implant unit tests
        # The per-handler unit tests live in a separate xUnit project
        # (tests/implant/dotnet) that is intentionally external to Rod.slnx,
        # mirroring the implant itself. Restoring it compiles the implant's
        # gRPC client bindings from the canonical rod.proto via Grpc.Tools (no
        # committed generated code), so this step also proves the proto compile
        # path. It exercises the internal handlers (collect/exfil/recon/persist/
        # lateral) and runner dispatch via InternalsVisibleTo, without standing
        # up a real teamserver.
        run: dotnet test tests/implant/dotnet/Rod.Implant.Tests.csproj --configuration Release
      - name: .NET implant end-to-end
        # DotNetImplantTests publishes the reference .NET implant to a temp dir
        # via `dotnet publish`, then runs `dotnet Rod.Implant.dll` as a real
        # subprocess against a real teamserver -- enrolls over HTTP, beacons over
        # mTLS, runs a dispatched shell.exec task. This is the job that proves the
        # .NET implant checks in and tasks end-to-end; it is otherwise skipped
        # when dotnet is not on PATH.
        run: dotnet test Rod.slnx --configuration Release --no-build --filter "FullyQualifiedName~DotNetImplantTests"

  dotnet-implant-windows:
    name: .NET implant (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
      - name: .NET implant unit tests (Windows)
        # The same per-handler suite as the ubuntu lane, run where those
        # handlers take their Windows paths: the toolhelp snapshot, the
        # NTFS file transfer, the schtasks/sc argument construction. The
        # win-x64 surface walk (rehearsal.md Sec 5) caught Windows-only
        # defect classes -- the recon.ps snapshot marshaling, the
        # native-tool payload quoting -- that an ubuntu-only CI lane
        # structurally cannot see; this lane makes them fail a build.
        run: dotnet test tests/implant/dotnet/Rod.Implant.Tests.csproj --configuration Release
      - name: .NET implant end-to-end (Windows)
        # The same end-to-end slice as the ubuntu lane, on Windows: the
        # implant's mTLS beacon rides SChannel there, so a leaf-presentation
        # defect that Linux's OpenSSL tolerates fails the handshake here.
        # The teamserver host builds API-only when the operator-UI bundle is
        # absent (the npm probe in Rod.TeamServer.csproj), which is all this
        # slice needs.
        run: dotnet test Rod.slnx --configuration Release --filter "FullyQualifiedName~DotNetImplantTests"

  dotnet-redirector:
    name: .NET redirector (Native AOT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        # Native AOT publish uses the SDK pinned by global.json and the platform
        # link-time toolchain the ubuntu-latest runner provides.
        uses: actions/setup-dotnet@v4
      - name: Install Native AOT link prerequisites
        # .NET Native AOT link-time analysis needs zlib on the build host; the
        # ubuntu-latest runner carries clang already. zlib1g-dev is a documented
        # Native AOT dependency on Debian/Ubuntu.
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Publish Native AOT forwarder
        # The redirector is a .NET Native AOT forwarder (ADR 0009/0011): a single
        # static binary with no runtime install. PublishAot is set in the csproj,
        # so this produces a native rod-redirector binary on the runner -- the
        # real proof the AOT property holds end to end. Normal build, test, and
        # format of the project are already covered by the build/test/format jobs
        # above (it ships in Rod.slnx).
        run: dotnet publish src/redirector/dotnet/Rod.Redirector.csproj -r linux-x64 -c Release
      - name: Verify single binary
        run: |
          set -e
          bin="$(find src/redirector/dotnet/bin/Release/net10.0/linux-x64/publish -maxdepth 1 -name rod-redirector -type f)"
          test -n "$bin"
          test -x "$bin"
          ls -lh "$bin"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        # Run the MIT-licensed gitleaks CLI directly rather than the
        # gitleaks-action wrapper, which requires a paid license key since v2.
        # Same scan the action ran: every commit in history, fail on any finding.
        # Pin the version explicitly so a upstream release cannot silently change
        # results.
        env:
          GITLEAKS_VERSION: "8.27.1"
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --verbose
