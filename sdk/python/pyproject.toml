[project]
name = "rod-sdk"
version = "0.1.0"
description = "The official Rod Python SDK over the /api/v1 operator API"
readme = "README.md"
requires-python = ">=3.10"
license = "Proprietary"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rod_sdk*"]
