syntax = "proto3";

package rod.v1;

// Rod wire protocol, frame layer only.
//
// Transport-agnostic (architecture.md Sec.8): HTTP(S), mTLS, DNS, SMB, TCP all
// carry these frames; the implant is always the connection initiator. Frames are
// opaque envelopes -- a redirector forwards the inner payload without parsing it.
//
// Sizing and flow control live at the transport layer, not here: a single frame
// stays well under 1 MiB and never exceeds the negotiated maximum; bulk data is
// chunked. Proto cannot express numeric limits, so this is a transport concern.

// Protocol version exchanged at handshake.
message ProtocolVersion {
  int32 major = 1;
  int32 minor = 2;
}

// The unit that crosses every transport. Payload is opaque: its inner shape is
// defined by the tasking, enrollment, and handshake messages below. Identity
// travels in mTLS (an implant certificate binds (implant_id, engagement_id),
// architecture.md Sec.9) and in the payload messages themselves, so the frame
// carries no envelope of its own. Field number 1 is retired: it held an
// envelope message nothing ever set, removed before any release shipped; it
// must not be reused (the evolution rules in extending/implants.md).
//
// kind disambiguates the payload shape on the upstream (implant-to-server)
// half of the CheckIn stream. It defaults to UNSPECIFIED for backward
// compatibility: existing TaskResult writers leave it unset and the server
// treats UNSPECIFIED as "try-parse as TaskResult". New upstream payload types
// (exfil chunks, staged pulls, channel output) set their kind so the
// server branches without nested try-parse. Downstream (server-to-implant)
// frames were originally positional only (handshake first, then TaskRequests,
// with a StagedChunk run interleaved when a staged task's payload is pulled);
// the interactive channel broke that: a ChannelInput can arrive between any
// two TaskRequests, so downstream channel frames DO set their kind and the
// implant discriminates kind first, falling back to the positional
// TaskRequest parse for kindless frames. A server only routes ChannelInput to
// an implant whose handshake advertised the channel verb, so an implant that
// never opted in never receives a kind-bearing downstream frame.
enum FrameKind {
  FRAME_KIND_UNSPECIFIED = 0;
  FRAME_KIND_TASK_RESULT = 1;
  FRAME_KIND_EXFIL_CHUNK = 2;
  // The implant's demand for a staged task's payload (architecture.md Sec 10,
  // the per-verb typed arm): sent after a TaskRequest whose staged_bytes is
  // set, before the task's result. The server answers with a run of
  // StagedChunk frames on the same stream.
  FRAME_KIND_STAGED_PULL = 3;
  // One chunk of a live task channel's output, implant to server
  // (architecture.md Sec 10.3, the streaming task shape). The channel's final
  // TaskResult closes the task -- ChannelOutput carries no terminal marker of
  // its own.
  FRAME_KIND_CHANNEL_OUTPUT = 4;
  // Operator input for a live task channel, server to implant: the downstream
  // half of the streaming task shape. The only kind-bearing downstream frame.
  FRAME_KIND_CHANNEL_INPUT = 5;
}

message Frame {
  reserved 1;
  bytes payload = 2;
  FrameKind kind = 3;
}

// A chunk of exfiltrated bytes the implant streams to the teamserver outside
// the single TaskResult.output string (architecture.md Sec 10.1 exfil, Sec 11
// artifacts). Bulk data is chunked per the frame-layer sizing contract above;
// the teamserver reassembles chunks sharing a (task_id, name) stream in
// sequence order and, on the terminal chunk, materializes them as an
// engagement-scoped Artifact attributed to the implant. task_id ties the chunk
// stream to the exfil.push task that produced it; name is the logical artifact
// name; content_type is a MIME hint (defaults to application/octet-stream);
// sequence is the chunk index within the stream -- the first chunk starts at
// 0 or 1 (both origins have shipped; the teamserver accepts either) and every
// following chunk must be exactly the next index; terminal marks the last
// chunk. The engagement is bound via mTLS, not the wire.
message ExfilChunk {
  string task_id = 1;
  string name = 2;
  string content_type = 3;
  uint64 sequence = 4;
  bool terminal = 5;
  bytes data = 6;
}

// The implant's demand for a staged task's payload: sent upstream (kind
// FRAME_KIND_STAGED_PULL) after a TaskRequest whose staged_bytes is set and
// before the task's result. The server answers downstream with a run of
// StagedChunk frames -- nothing bulk ever flows downstream unasked, so an
// implant that does not implement staged uploads never receives a chunk frame
// (architecture.md Sec 10, the per-verb typed arm; extending/implants.md Tier
// 2).
message StagedPull {
  string task_id = 1;
}

// One chunk of a staged payload the teamserver streams downstream in answer
// to a StagedPull: the mirror of ExfilChunk in the other direction. task_id
// echoes the demanded task; sequence is the 0-origin chunk index; terminal
// marks the last chunk (a demand whose task holds no staged payload is
// answered with a single empty terminal chunk, so a demanding implant always
// resolves rather than hangs). Payload integrity is bound to the signed task
// by the sha256 token the issuer appends to the task's arguments -- the
// chunks themselves carry no signature of their own.
message StagedChunk {
  string task_id = 1;
  uint64 sequence = 2;
  bool terminal = 3;
  bytes data = 4;
}

// One chunk of a live task channel's output, sent upstream as kind
// FRAME_KIND_CHANNEL_OUTPUT (architecture.md Sec 10.3, the streaming task
// shape). A streaming task -- the reference verb is shell.interact -- runs
// past the one-shot TaskResult grammar: the implant starts it on the
// TaskRequest, streams whatever the task produces as these chunks, and closes
// the task with an ordinary TaskResult when the channel ends. task_id ties
// each chunk to its task; the chunk order on the stream is the transcript
// order. Chunks are opaque bytes -- the frame-layer sizing contract above
// applies -- and the server accumulates them into the task's transcript, so
// an operator reads a live shell the same way it reads a captured one. The
// channel is session-scoped: it lives on the beacon stream that carried its
// TaskRequest, and a stream drop ends it (the shell is killed and the task's
// result never comes -- the task stays dispatched; liveness is last-seen
// based, Sec 10.3).
message ChannelOutput {
  string task_id = 1;
  bytes data = 2;
}

// Operator input for a live task channel, sent downstream as kind
// FRAME_KIND_CHANNEL_INPUT: the other direction of the streaming task shape.
// task_id names the running channel; data is what the operator typed (opaque
// bytes, typically UTF-8); eof marks the operator closing the channel's stdin
// -- the implant closes the shell's input, the shell exits, and the task
// completes through its final TaskResult. Input is not signed: like
// StagedChunk runs it rides the mTLS beacon stream the signed TaskRequest
// opened, and only a channel the implant itself started accepts it.
message ChannelInput {
  string task_id = 1;
  bytes data = 2;
  bool eof = 3;
}

// Enrollment outcome, mapped from the stager-token redeem result
// (architecture.md Sec.9). The transport endpoint maps each redeem failure to a
// distinct status so an implant gets an actionable reason, not just "no".
enum EnrollStatus {
  ENROLL_STATUS_UNSPECIFIED = 0;
  ENROLL_STATUS_OK = 1;
  ENROLL_STATUS_BAD_TOKEN = 2;
  ENROLL_STATUS_EXPIRED = 3;
  ENROLL_STATUS_SPENT = 4;
}

// The enrollment response. On OK, carries the newly issued
// implant id, its engagement, and the bound leaf certificate plus the CA chain
// the implant needs. On failure, the ids/cert fields are empty and only status
// is meaningful. parent_implant_id is set only for a child enroll that named a
// parent (architecture.md Sec 10.1): it echoes the parent recorded server-side
// so a derived implant can confirm its lineage. A top-level enroll leaves it
// unset.
message EnrollResponse {
  EnrollStatus status = 1;
  string implant_id = 2;
  string engagement_id = 3;
  bytes leaf_certificate = 4;
  repeated bytes ca_chain = 5;
  optional string parent_implant_id = 6;
}

// Handshake on the CheckIn stream. The implant's first Frame's
// payload carries a HandshakeRequest; the server's first Frame back carries a
// HandshakeResponse. Both are opaque Frame payloads -- the stream contract is
// unchanged, only the inner shape is defined here.

// The implant's advertisement: its protocol version, identity, and the
// capability verbs it can dispatch (architecture.md Sec 10). implant_id is
// echoed for routing/audit; the binding is authoritative via mTLS, not the wire
// (architecture.md Sec 9).
message HandshakeRequest {
  ProtocolVersion version = 1;
  string implant_id = 2;
  repeated string capabilities = 3;
  // The implant's opt-in to the tasking replay-nonce arm (architecture.md
  // Sec 9 -- tasking replay nonces), the negotiated addition the evolution
  // rules require: absent or false, every dispatched TaskRequest for this
  // implant keeps the nonce-less shape and the four-element signed tuple, so
  // a Tier 0 implant interoperates unchanged. Set once, the server answers
  // replay_nonces on the HandshakeResponse and stamps each dispatched task
  // with a per-implant monotonic task_nonce covered by the signature.
  optional bool replay_nonces = 4;
}

// Outcome of the handshake. OK means presence is recorded and the stream is
// live; anything else closes the stream.
enum HandshakeStatus {
  HANDSHAKE_STATUS_UNSPECIFIED = 0;
  HANDSHAKE_STATUS_OK = 1;
  HANDSHAKE_STATUS_VERSION_MISMATCH = 2;
  HANDSHAKE_STATUS_UNKNOWN_IMPLANT = 3;
  HANDSHAKE_STATUS_IDENTITY_MISMATCH = 4;
  // The implant's baked-in kill date has passed (architecture.md Sec 7). The
  // teamserver refuses to open a session for an implant past its kill date;
  // the stream closes and the implant is expected to self-terminate.
  HANDSHAKE_STATUS_KILL_DATE_EXPIRED = 5;
  // The implant has been retired (architecture.md Sec 7). A retired
  // implant is taken out of operation and never gets a session again; the
  // teamserver refuses to open one and the stream closes. Like kill date, the
  // refusal is authoritative server-side -- the implant need not be told in
  // advance.
  HANDSHAKE_STATUS_IMPLANT_RETIRED = 6;
}

// The server's handshake reply. version is the negotiated protocol version;
// engagement_id is echoed so the implant can confirm its bound engagement.
message HandshakeResponse {
  HandshakeStatus status = 1;
  ProtocolVersion version = 2;
  string engagement_id = 3;
  // Echoed true when the server accepted the implant's replay_nonces
  // advertisement (HandshakeRequest.replay_nonces): from this handshake on,
  // every dispatched TaskRequest for this implant carries task_nonce and its
  // signature covers the five-element tuple, and a nonce-negotiating implant
  // refuses nonce-less tasking. Absent on a server serving the implant's
  // request without the arm -- the fallback that keeps older pairs
  // interoperating.
  optional bool replay_nonces = 4;
}

// Tasking over the CheckIn stream. After the handshake the stream
// carries tasking downstream and results upstream, each as an opaque Frame
// payload. The one-shot shape here -- a single verb with a single argument
// string and a single result -- covers most verbs; the streaming task shape
// (ChannelOutput/ChannelInput around the same TaskRequest/TaskResult pair)
// covers the verbs that run interactively.

// A task handed to the implant: its id (echoed back on the result so the server
// can correlate), the capability verb, and its argument string, and the
// teamserver's signature over the tasking tuple (architecture.md Sec 9 --
// command signing). The signature is RSASSA-PSS over SHA-256 with the tasking
// CA's RSA key -- the same CA that signs implant leaves, so the verifying public
// key is the CA the implant already holds from enrollment or its pinned bundle.
//
// The signed bytes are a fixed canonical encoding, not the serialized message,
// so every implant language verifies the same way without a proto runtime
// guaranteeing field order: for each of implant_id, task_id, verb, arguments
// in that order, the little-endian uint32 byte length of its UTF-8 encoding
// followed by those bytes. implant_id is the target implant's own id (the
// verifier's identity, authoritative via mTLS and the handshake, not a field
// on this message): binding it into the signature makes a frame signed for one
// implant fail verification on any other, so captured tasking cannot be
// replayed cross-implant within a CA. An empty signature means unsigned.
// Verification is each implant's own hardening choice -- the reference
// implant rejects unsigned and wrongly signed tasks, and the server cannot
// observe which side an implant took.
//
// staged_bytes is the per-verb typed arm (architecture.md Sec 10): when set,
// the task's bulk payload does not ride the arguments string -- it is staged
// server-side, the arguments end with a sha256:<hex> token binding the
// payload's bytes into the signed tuple above, and the implant demands the
// bytes with a StagedPull before reporting the task's result. The field is
// advisory (a size sanity check); the hash token is the integrity authority.
// An implant that does not implement the arm ignores the unknown field and
// fails the verb on its own grammar -- the fallback the evolution rules
// require, with no new mandatory work on the task path.
//
// task_nonce is the replay-nonce arm (architecture.md Sec 9 -- tasking replay
// nonces), negotiated at handshake: present only on tasking for an implant
// whose handshake set HandshakeRequest.replay_nonces, and then on every
// dispatched task. The value is per-implant monotonic -- strictly increasing
// across dispatches, sessions, and transports -- and a nonce-bearing task's
// signature covers the five-element canonical tuple (implant_id, task_id,
// verb, arguments, nonce-as-decimal-string), the nonce appended in the same
// length-prefixed form as the other four. An implant that negotiated the arm
// tracks the highest nonce it accepted and refuses any at or below it, so a
// captured frame replayed to the same implant fails there; the refusal is
// reported as the task's Failed result, surfacing the attack on the task.
// An implant that never advertised keeps receiving nonce-less tasking with
// the original four-element tuple, unchanged.
message TaskRequest {
  string task_id = 1;
  string verb = 2;
  string arguments = 3;
  bytes signature = 4;
  optional uint64 staged_bytes = 5;
  optional uint64 task_nonce = 6;
}

// How a task turned out, as reported by the implant.
enum TaskOutcome {
  TASK_OUTCOME_UNSPECIFIED = 0;
  TASK_OUTCOME_SUCCEEDED = 1;
  TASK_OUTCOME_FAILED = 2;
}

// The implant's result for a task: the echoed task_id, the outcome, and the
// captured output (stdout/stderr or equivalent). Carried even on failure so the
// server captures the cause.
message TaskResult {
  string task_id = 1;
  TaskOutcome outcome = 2;
  string output = 3;
}

// Implant-initiated beacon channel (architecture.md Sec.5/8). The implant opens
// a long-lived reverse connection; the first exchange is the handshake, then
// the stream carries tasking and results for the life of the stream.
service Beacon {
  rpc CheckIn(stream Frame) returns (stream Frame);
}
