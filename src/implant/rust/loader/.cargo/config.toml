# The loader provides its own _start over raw syscalls (no libc, no CRT
# startup), so each static musl target links without the self-contained CRT
# and as a non-PIE static image: the plain executable shape a memfd exec
# wants, and the smallest set of headers and relocations the format allows.
# Scoped to this package's targets alone -- the implant crate beside it
# keeps its default, CRT-linked build.
[target.x86_64-unknown-linux-musl]
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-self-contained=no",
    "-C", "relocation-model=static",
]

[target.aarch64-unknown-linux-musl]
rustflags = [
    "-C", "link-arg=-nostartfiles",
    "-C", "link-self-contained=no",
    "-C", "relocation-model=static",
]
