[package]
name = "rod-module-hostenum"
version = "1.0.0"
edition = "2021"

# The reference plugin module (architecture.md Sec 5.4): recon.hostenum
# written against the SDK, benign and readable, the shape an operator's own
# modules copy. Built as a cdylib for the target's own platform and
# delivered as a module.load task's content -- it never rides an artifact.

[lib]
# rlib beside cdylib so the bin target below links the same plugin code;
# cargo emits the rlib for internal use only, the cdylib is the artifact.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rod-module-hostenum"
path = "src/main.rs"

[dependencies]
rod-plugin-sdk = { path = "../../plugin-sdk" }
