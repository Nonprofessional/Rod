[package]
name = "rod-plugin-sdk"
version = "1.0.0"
edition = "2021"

# The implant-side plugin seam's authoring surface (architecture.md Sec 5.4):
# a plain Rust trait plus the rod_plugin! macro that emits the extern "C"
# shim. A module is a cdylib compiled for the target's own platform; the C
# ABI is the only boundary stable across compiler versions, so it -- not a
# Rust trait object -- is what crosses the load.
#
# Like the implant crate, this project is an EXTERNAL component outside
# Rod.slnx. Module authors depend on it from their own trees; the reference
# module in ../modules/hostenum is the worked example.

